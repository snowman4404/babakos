<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jual barang bekas kost ke sesama mahasiswa UB lewat BaBaKos.">
    <title>Jual Barang — BaBaKos</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-auth="required">
    <header id="site-header" data-bar="Jual Barang" data-back="profil.html"></header>

    <main class="container page">
      <!-- Listing form + live preview card. Filled by js/pages/jual.js. -->
      <form class="sell" id="sell-form" novalidate>
        <div class="sell-main">
          <section class="card" aria-labelledby="photo-title">
            <div class="card-head">
              <div>
                <h2 class="h3" id="photo-title">Foto barang</h2>
                <p class="caption">Sampai 3 foto. Foto pertama jadi sampul. Latar polos dan terang paling jelas.</p>
              </div>
            </div>
            <div class="photos" id="photos">
              <label class="photo-add" id="photo-add">
                <input class="sr-only" type="file" id="photo-input" accept="image/*" multiple aria-describedby="photo-error">
                <span data-icon="image" data-icon-size="28"></span>
                <span>Tambah foto</span>
              </label>
            </div>
            <p class="field-error" id="photo-error" hidden></p>
          </section>

          <section class="card sell-fields" aria-labelledby="info-title">
            <h2 class="h3 card-head" id="info-title">Info barang</h2>
            <div class="field">
              <label class="field-label" for="title">Nama barang</label>
              <input class="input" id="title" name="title" maxlength="60" placeholder="Mis. Kipas Angin Miyako 16 inch" aria-describedby="title-count title-error">
              <div class="field-row"><p class="field-error" id="title-error" hidden></p><span class="field-hint" id="title-count">0/60</span></div>
            </div>
            <div class="field">
              <label class="field-label" for="desc">Deskripsi</label>
              <textarea class="textarea" id="desc" name="desc" maxlength="300" placeholder="Kondisi, kelengkapan, alasan dijual, minus kalau ada." aria-describedby="desc-count"></textarea>
              <span class="field-hint field-count" id="desc-count">0/300</span>
            </div>
            <fieldset class="field">
              <legend class="field-label">Kategori</legend>
              <div class="chips" id="cats"></div>
              <p class="field-error" id="cat-error" hidden></p>
            </fieldset>
            <fieldset class="field">
              <legend class="field-label">Kondisi</legend>
              <div class="chips" id="conds"></div>
            </fieldset>
            <div class="sell-split">
              <div class="field">
                <label class="field-label" for="price">Harga</label>
                <div class="input-group">
                  <span class="input-prefix" aria-hidden="true">Rp</span>
                  <input class="input" id="price" name="price" inputmode="numeric" placeholder="0" autocomplete="off" aria-describedby="price-hint price-error">
                </div>
                <p class="field-hint" id="price-hint">Isi harga dalam rupiah.</p>
                <p class="field-error" id="price-error" hidden></p>
              </div>
              <div class="field">
                <label class="field-label" for="area">Area kost</label>
                <span class="select"><select id="area" name="area"></select></span>
                <p class="field-hint">Pembeli melihat jarak dari area ini.</p>
              </div>
            </div>
          </section>
        </div>

        <aside class="sell-side">
          <section class="card" aria-labelledby="preview-title">
            <h2 class="h3 card-head" id="preview-title">Pratinjau di katalog</h2>
            <ul class="pgrid sell-preview" id="preview" aria-live="polite"></ul>
            <ul class="sell-check" id="checklist"></ul>
            <button class="btn btn-block" type="submit" id="publish">Terbitkan Barang</button>
            <button type="button" class="link-btn sell-sample" id="sample">Isi contoh untuk demo</button>
          </section>
        </aside>
      </form>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/jual.js"></script>
  </body>
</html>
