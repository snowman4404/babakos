<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BaBaKos — jual beli barang bekas kost khusus mahasiswa kampus se-Malang. Email kampus terverifikasi, chat dengan kartu barang, COD di titik aman.">
    <title>BaBaKos — Barang Bekas Kost Mahasiswa Malang</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <a class="skip" href="#isi">Langsung ke isi</a>
    <header id="site-header"></header>

    <main id="isi" class="home">
      <!-- Figma BERANDA: banner, category icons, products. Filled by js/pages/index.js. -->
      <section class="container home-banner" aria-label="Sorotan">
        <div class="banner" id="banner">
          <div class="banner-track" id="banner-track"></div>
          <div class="banner-dots" id="banner-dots" role="group" aria-label="Pilih sorotan"></div>
        </div>
      </section>

      <section class="container home-cats" aria-labelledby="cats-title">
        <h2 class="sr-only" id="cats-title">Kategori</h2>
        <ul class="cats" id="cats" data-reveal-group></ul>
      </section>

      <section class="container home-section" id="near-section" aria-labelledby="near-title" hidden>
        <div class="section-head">
          <div>
            <h2 class="h2" id="near-title">Dekat kostmu</h2>
            <p class="caption" id="near-sub"></p>
          </div>
          <a class="text-action" id="near-more" href="jelajah.html">Lihat semua<span data-icon="arrow-right"></span></a>
        </div>
        <ul class="pgrid" id="near-grid"></ul>
      </section>

      <section class="container home-section" aria-labelledby="new-title">
        <div class="section-head">
          <div>
            <h2 class="h2" id="new-title">Baru diunggah</h2>
            <p class="caption" id="new-sub"></p>
          </div>
          <a class="text-action" href="jelajah.html">Lihat katalog<span data-icon="arrow-right"></span></a>
        </div>
        <ul class="pgrid" id="new-grid"></ul>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages/index.js"></script>
  </body>
</html>
